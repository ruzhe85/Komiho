name: Build debug self-test APK

# Komiho (2026-10-27): 产出 **debug** APK，用于 adb 跑 MTK 后端的 CPU 验证自检。
#
# 为什么不复用主构建：主构建出的是 release（R8 会裁掉没有调用点的 `LiteRtNative`），
# 而自检 Activity 只存在于 debug 源集（`app/src/debug/`），release 包里根本没有。
#
# 用法：
#   1. 本 workflow 跑完后下载 artifact（app-arm64-v8a-debug.apk）；
#   2. adb install -r 该 APK + komiho-model-mediatek.apk；
#   3. adb shell am start -n cn.ruzhe.komiho.debug/eu.kanade.tachiyomi.util.waifu2x.LiteRtSelfTestActivity
#   4. adb logcat -s LiteRtSelfTest
#
# 该 APK 与 CI/正式包 applicationId 不同（`.debug` 后缀），可与日常安装共存。

"on":
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x gradlew

      # 只编 arm64：LiteRT 的 MTK 插件库与 QNN 运行时都只有 arm64 实现。
      - name: Build debug APK (arm64-v8a)
        run: ./gradlew :app:assembleDebug -PkomihoAbi=arm64-v8a --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: litert-selftest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
