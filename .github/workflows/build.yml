name: Build Komiho V2 APK

"on":
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.svg'
      - '**.gif'
      - '.github/readme-images/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "发布模式: ci = 测试版(默认, 固定 tag CI), formal = 正式版 (vX.Y.Z)"
        required: false
        default: ci
        type: choice
        options:
          - ci
          - formal

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # MihonSY: cache Gradle dependencies — cuts rebuild time roughly in half.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      # Komiho: setup-android@v4 has a default `packages: 'tools platform-tools'`, but Google
      # has retired the legacy "tools" package from the SDK repository — `sdkmanager tools`
      # now prints "Failed to find package 'tools'" and exits 1, which fails this action
      # (run 34983288701 died here in 50s, before any compilation). Override the default so
      # only platform-tools is pulled; everything else we need is installed explicitly below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Komiho V2: fixed debug keystore — every build carries the same signature
      # so APKs can be installed over the previous one (no uninstall needed).
      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-debug.jks
          ls -la keystore/

      # Komiho V2: independent release keystore (PKCS12, alias komiho-release) —
      # distinct from MihonSY's mihonmod key so the two apps can coexist.
      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-release.jks
          ls -la keystore/

      # Komiho: resolve publish mode —— 必须在构建之前定，因为两种模式的 ABI 集合不同
      # （ci 只要 arm64，正式版要 arm64 + 合并包）。
      # - push: HEAD commit message 含 "[release]"（或 "正式版"）→ formal，其余 → ci。
      # - workflow_dispatch: 用 mode 输入。
      # 两种模式都签同一个 release keystore（komiho-release.jks），所以 CI 与正式版
      # 在设备上可互相覆盖。
      - name: Resolve publish mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MSG=$(git log -1 --format=%s)
            if echo "$MSG" | grep -qiE '\[release\]|正式版'; then
              MODE=formal
            else
              MODE=ci
            fi
          fi
          echo "mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Komiho V2: build Release (not Debug) so the bundled native LZ3 gets full
      # compiler optimization (-O2/-O3 + NDEBUG). Debug builds leave the C++ at -O0,
      # which made Lanczos3 ~30-40x slower than MihonSY's Release APK on the same
      # device. Signed with the independent release keystore so it installs alongside
      # MihonSY without needing to uninstall it.
      #
      # `-PkomihoAbi=arm64-v8a` narrows the ABI splits to this single ABI (see
      # app/build.gradle.kts): the daily channel only ever needs the arm64 phone APK,
      # and it also disables the merged universal APK, which is the single slowest
      # asset to upload. `ci-npu.yml` builds every ABI for real releases.
      #
      # Komiho (2026-09-26): ABI 按发布模式收敛 —— QNN/HTP 运行时只有 arm64 实现。
      #   ci     → 只出 arm64 单包（构建 + 上传最快）
      #   formal → arm64 + 合并包（= `-PkomihoUniversal=true`），供不挑 ABI 的用户直接装
      - name: Build release APK
        env:
          KOMIHO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KOMIHO_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          EXTRA=""
          if [ "${{ steps.mode.outputs.mode }}" = "formal" ]; then
            EXTRA="-PkomihoUniversal=true"
          fi
          echo "ABI flags: -PkomihoAbi=arm64-v8a $EXTRA"
          ./gradlew assembleRelease -Pdisable-code-shrink -PkomihoAbi=arm64-v8a $EXTRA --no-daemon --stacktrace

      # 按发布模式重命名：ci → komiho-ci-{abi}.apk；formal → komiho-{version}-{abi}.apk。
      # formal 才出 universal（见上方 -PkomihoUniversal=true），ci 单 ABI 不会有 universal。
      - name: "Rename APKs"
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -1)
          cd "$GITHUB_WORKSPACE/app/build/outputs/apk/release"
          for apk in app-*.apk; do
            [ -e "$apk" ] || continue
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            if [ "$MODE" = "formal" ]; then
              mv "$apk" "komiho-${VERSION_NAME}-${abi}.apk"
            else
              mv "$apk" "komiho-ci-${abi}.apk"
            fi
          done
          ls -la

      # Komiho CI Release: 固定 tag "CI"，prerelease（黄标），永不成为绿色 Latest。
      # 每次构建覆盖同一 release（单一 CI 通道，不产生每构建一个 tag 的碎片化）。
      #
      # Komiho (2026-09-18): arm64-v8a ONLY for the daily channel。
      # 实测 run 35248730805 —— 23m40s 里 "Build release APK" 仅 5m26s，而 "Upload APK"
      # 烧了 16m51s（71%）。release 上传 API 是单连接、大文件主导一切。只传一个 ABI
      # 约减半耗时。armeabi-v7a 仍由 ci-npu.yml 在需要时构建；daily 通道是冒烟/性能通道，
      # 测试机为 arm64。若日后想要 daily v7a 包，再在此处恢复 v7a 上传。
      - name: "Publish CI release (test build)"
        if: steps.mode.outputs.mode == 'ci'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="CI"
          TITLE="Komiho-CI"
          RUN_NO="${{ github.run_number }}"
          BUILD_DATE=$(date -u +%Y%m%d)
          NOTES="Auto build #${RUN_NO} · ${{ github.sha }} · ${BUILD_DATE}T$(date -u +%H:%M:%SZ)"
          cd app/build/outputs/apk/release

          # Komiho (2026-09-18): retry the asset upload. 打包 libQnnHtpPrepare.so 后
          # arm64 APK 从 ~80 MB 涨到 ~110 MB，release-asset 上传端点单连接、无断点续传，
          # 在该尺寸下约 5.5 分钟后返回裸
          #
          #     HTTP 500: Error saving asset (.../komiho-ci-arm64-v8a.apk)
          #
          # （run 35256372680）。构建本身绿：APK 已存在且 QNN 资产校验通过。uploads.github.com
          # 的 500 绝大多数是瞬时故障，故用递增退避重试，失败才宣告 job 红。不要为了
          # "传更快" 去掉它——没有它，单后端抖动就会把一次好构建变红。
          upload_with_retry() {
            local file="$1" attempt delay
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" \
                   --repo "${{ github.repository }}" \
                   --clobber; then
                echo "uploaded $file (attempt $attempt)"
                return 0
              fi
              delay=$((attempt * 20))
              echo "::warning::upload of $file failed (attempt $attempt/5), retrying in ${delay}s"
              sleep "$delay"
            done
            echo "::error::upload of $file failed after 5 attempts"
            return 1
          }

          # 先小后大上传，确保用户真要刷的 APK 在任何长传输超时前先落地。
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release 已存在：就地覆盖 APK，保留固定标题。
            for apk in $(ls -S -r komiho-ci-*.apk); do
              upload_with_retry "$apk"
            done
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            # 首次：先建无资产的 release，再逐个走重试 helper。直接把文件传给
            # `gh release create` 每资产只有一次机会，正是 run 35256372680 失败的那条路径。
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
            for apk in $(ls -S -r komiho-ci-*.apk); do
              upload_with_retry "$apk"
            done
          fi

      # Komiho formal release: 版本化 tag v{x.y.z} + changelog，成为 GitHub Latest。
      - name: "Publish formal release"
        if: steps.mode.outputs.mode == 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/release"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -1)
          TAG="v${VERSION_NAME}"

          echo "Publishing formal release ${TAG}"

          # 删除同名 release/tag，使重构建可原地重发。
          cd "$GITHUB_WORKSPACE"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # 从 changelog 文件抽取本版本段落。
          extract_section() {
            awk -v ver="v${VERSION_NAME}" '
              /^## / {
                if (section) exit
                if (index($0, ver) > 0) { section=1; next }
              }
              section { print }
            ' "$1"
          }

          NOTES_FILE=$(mktemp)
          {
            echo "## 中文 / Chinese"
            echo ""
            extract_section CHANGELOG.md || true
            echo ""
            echo "---"
            echo ""
            echo "## English"
            echo ""
            extract_section CHANGELOG.en.md || true
          } > "$NOTES_FILE"

          # 两段都没匹配到时的兜底。
          if ! grep -qE '^## ' "$NOTES_FILE"; then
            {
              echo "Komiho ${VERSION_NAME}"
              echo ""
              echo "Built automatically from the main branch."
            } > "$NOTES_FILE"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Komiho ${VERSION_NAME}" \
            --notes-file "$NOTES_FILE" \
            "${APK_DIR}/komiho-${VERSION_NAME}-"*.apk

          echo "Published release $TAG"
