name: Build Komiho V2 APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # MihonSY: cache Gradle dependencies — cuts rebuild time roughly in half.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Komiho V2: fixed debug keystore — every build carries the same signature
      # so APKs can be installed over the previous one (no uninstall needed).
      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-debug.jks
          ls -la keystore/

      # Komiho V2: independent release keystore (PKCS12, alias komiho-release) —
      # distinct from MihonSY's mihonmod key so the two apps can coexist.
      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-release.jks
          ls -la keystore/

      # Komiho V2: build Release (not Debug) so the bundled native LZ3 gets full
      # compiler optimization (-O2/-O3 + NDEBUG). Debug builds leave the C++ at -O0,
      # which made Lanczos3 ~30-40x slower than MihonSY's Release APK on the same
      # device. Signed with the independent release keystore so it installs alongside
      # MihonSY without needing to uninstall it.
      - name: Build release APK
        env:
          KOMIHO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KOMIHO_RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Pdisable-code-shrink --no-daemon --stacktrace

      # Fixed CI Release: tag "CI", title "Komiho-CI". Every build overwrites the
      # same release (single CI channel, no per-build tag sprawl). The git tag "CI"
      # is reused — if a release already exists we just re-upload (clobber) the APKs
      # and keep the title fixed. Pre-release (yellow), never the green "Latest".
      - name: "Rename APKs to komiho-ci-*"
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*.apk; do
            [ -e "$apk" ] || continue
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            mv "$apk" "komiho-ci-${abi}.apk"
          done
          ls -la

      - name: "Upload APK to CI Release (tag: CI, title: Komiho-CI)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="CI"
          TITLE="Komiho-CI"
          RUN_NO="${{ github.run_number }}"
          BUILD_DATE=$(date -u +%Y%m%d)
          NOTES="Auto build #${RUN_NO} · ${{ github.sha }} · ${BUILD_DATE}T$(date -u +%H:%M:%SZ)"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release exists: overwrite APKs in place, keep fixed title.
            gh release upload "$TAG" app/build/outputs/apk/release/komiho-ci-*.apk \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            # First time: create the fixed CI release.
            gh release create "$TAG" app/build/outputs/apk/release/komiho-ci-*.apk \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
