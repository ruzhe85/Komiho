name: Build Komiho V2 APK

"on":
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.svg'
      - '**.gif'
      - '.github/readme-images/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # MihonSY: cache Gradle dependencies — cuts rebuild time roughly in half.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      # Komiho: setup-android@v4 has a default `packages: 'tools platform-tools'`, but Google
      # has retired the legacy "tools" package from the SDK repository — `sdkmanager tools`
      # now prints "Failed to find package 'tools'" and exits 1, which fails this action
      # (run 34983288701 died here in 50s, before any compilation). Override the default so
      # only platform-tools is pulled; everything else we need is installed explicitly below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Komiho V2: fixed debug keystore — every build carries the same signature
      # so APKs can be installed over the previous one (no uninstall needed).
      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-debug.jks
          ls -la keystore/

      # Komiho V2: independent release keystore (PKCS12, alias komiho-release) —
      # distinct from MihonSY's mihonmod key so the two apps can coexist.
      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-release.jks
          ls -la keystore/

      # Komiho V2: build Release (not Debug) so the bundled native LZ3 gets full
      # compiler optimization (-O2/-O3 + NDEBUG). Debug builds leave the C++ at -O0,
      # which made Lanczos3 ~30-40x slower than MihonSY's Release APK on the same
      # device. Signed with the independent release keystore so it installs alongside
      # MihonSY without needing to uninstall it.
      - name: Build release APK
        env:
          KOMIHO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KOMIHO_RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Pdisable-code-shrink --no-daemon --stacktrace

      # Fixed CI Release: tag "CI", title "Komiho-CI". Every build overwrites the
      # same release (single CI channel, no per-build tag sprawl). The git tag "CI"
      # is reused — if a release already exists we just re-upload (clobber) the APKs
      # and keep the title fixed. Pre-release (yellow), never the green "Latest".
      #
      # Komiho (2026-09-18): only the per-ABI APKs are uploaded here. The universal
      # APK (all ABIs merged) is ~190 MB once the QNN contexts and both HTP Skel/stub
      # pairs are bundled, and `gh release upload` gave up on it after 18 minutes with
      # `HTTP 400: 400 Bad Request` — the per-ABI APKs had already landed by then, so
      # the build "failed" purely on the biggest asset. Dropping it keeps this channel
      # fast and green; the universal package is produced by `ci-npu.yml` on demand.
      # ABI list is arm64-v8a + armeabi-v7a only (see app/build.gradle.kts splits).
      - name: "Rename APKs to komiho-ci-*"
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*.apk; do
            [ -e "$apk" ] || continue
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            mv "$apk" "komiho-ci-${abi}.apk"
          done
          # Keep the universal one out of this channel (see note above).
          rm -f komiho-ci-universal.apk
          ls -la

      - name: "Upload APK to CI Release (tag: CI, title: Komiho-CI)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="CI"
          TITLE="Komiho-CI"
          RUN_NO="${{ github.run_number }}"
          BUILD_DATE=$(date -u +%Y%m%d)
          NOTES="Auto build #${RUN_NO} · ${{ github.sha }} · ${BUILD_DATE}T$(date -u +%H:%M:%SZ)"
          # Upload smallest-first so the APKs people actually flash land before any
          # long transfer can time out.
          cd app/build/outputs/apk/release
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release exists: overwrite APKs in place, keep fixed title.
            for apk in $(ls -S -r komiho-ci-*.apk); do
              gh release upload "$TAG" "$apk" \
                --repo "${{ github.repository }}" \
                --clobber
            done
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            # First time: create the fixed CI release.
            gh release create "$TAG" $(ls -S -r komiho-ci-*.apk) \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
