name: Build Komiho V2 APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # MihonSY: cache Gradle dependencies — cuts rebuild time roughly in half.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Komiho V2: fixed debug keystore — every build carries the same signature
      # so APKs can be installed over the previous one (no uninstall needed).
      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-debug.jks
          ls -la keystore/

      # Komiho M1: compile-verify only (no signing/release yet — M5 adds the
      # release pipeline with keystore secrets). Debug APK is enough to validate
      # compilation of the Komga data layer + UI.
      - name: Build debug APK
        run: ./gradlew assembleDebug -Pdisable-code-shrink --no-daemon --stacktrace

      # Multi-version CI: every push produces one uniquely-tagged Release
      # (ci-<run>-<sha>) marked as Pre-release. No "ci-apk" latest pointer —
      # each build is an independent, never-overwritten history entry, newest
      # sorts to the top of the Releases list.
      - name: Upload APKs to per-build Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_NO="${{ github.run_number }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          TAG="ci-${RUN_NO}-${SHORT_SHA}"
          TITLE="Komiho V2 CI #${RUN_NO} · ${SHORT_SHA} · ${BUILD_DATE}"
          NOTES="Auto build #${RUN_NO} · ${{ github.sha }} · ${BUILD_DATE}T$(date -u +%H:%M:%SZ)"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            || gh release upload "$TAG" app/build/outputs/apk/debug/*.apk \
                 --repo "${{ github.repository }}" --clobber
