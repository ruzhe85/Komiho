name: Build Komiho V2 APK

"on":
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.svg'
      - '**.gif'
      - '.github/readme-images/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # MihonSY: cache Gradle dependencies — cuts rebuild time roughly in half.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      # Komiho: setup-android@v4 has a default `packages: 'tools platform-tools'`, but Google
      # has retired the legacy "tools" package from the SDK repository — `sdkmanager tools`
      # now prints "Failed to find package 'tools'" and exits 1, which fails this action
      # (run 34983288701 died here in 50s, before any compilation). Override the default so
      # only platform-tools is pulled; everything else we need is installed explicitly below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Komiho V2: fixed debug keystore — every build carries the same signature
      # so APKs can be installed over the previous one (no uninstall needed).
      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-debug.jks
          ls -la keystore/

      # Komiho V2: independent release keystore (PKCS12, alias komiho-release) —
      # distinct from MihonSY's mihonmod key so the two apps can coexist.
      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-release.jks
          ls -la keystore/

      # Komiho V2: build Release (not Debug) so the bundled native LZ3 gets full
      # compiler optimization (-O2/-O3 + NDEBUG). Debug builds leave the C++ at -O0,
      # which made Lanczos3 ~30-40x slower than MihonSY's Release APK on the same
      # device. Signed with the independent release keystore so it installs alongside
      # MihonSY without needing to uninstall it.
      #
      # `-PkomihoAbi=arm64-v8a` narrows the ABI splits to this single ABI (see
      # app/build.gradle.kts): the daily channel only ever needs the arm64 phone APK,
      # and it also disables the merged universal APK, which is the single slowest
      # asset to upload. `ci-npu.yml` builds every ABI for real releases.
      - name: Build release APK
        env:
          KOMIHO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KOMIHO_RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Pdisable-code-shrink -PkomihoAbi=arm64-v8a --no-daemon --stacktrace

      # Fixed CI Release: tag "CI", title "Komiho-CI". Every build overwrites the
      # same release (single CI channel, no per-build tag sprawl). The git tag "CI"
      # is reused — if a release already exists we just re-upload (clobber) the APKs
      # and keep the title fixed. Pre-release (yellow), never the green "Latest".
      #
      # Komiho (2026-09-18): only the per-ABI APKs are uploaded here. The universal
      # APK (all ABIs merged) is ~270 MB once the QNN contexts, both HTP Skel/stub
      # pairs and the 79 MB libQnnHtpPrepare.so are bundled, and `gh release upload`
      # gave up on it after 18 minutes with
      # `HTTP 400: 400 Bad Request` — the per-ABI APKs had already landed by then, so
      # the build "failed" purely on the biggest asset. Dropping it keeps this channel
      # fast and green; the universal package is produced by `ci-npu.yml` on demand.
      # ABI list is arm64-v8a + armeabi-v7a only (see app/build.gradle.kts splits).
      #
      # Komiho (2026-09-18, later): arm64-v8a ONLY for the daily channel.
      # Measured on run 35248730805 — of 23m40s total, "Build release APK" was only
      # 5m26s while "Upload APK" burned 16m51s (71%). The release upload API is
      # single-connection and large assets dominate everything else. Uploading just
      # one ABI ~halves that. armeabi-v7a is still built by `ci-npu.yml` when needed;
      # the daily channel is a smoke/perf channel and the test device is arm64. Restore
      # the v7a upload here if the daily v7a package is ever wanted again.
      - name: "Rename APKs to komiho-ci-*"
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*.apk; do
            [ -e "$apk" ] || continue
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            mv "$apk" "komiho-ci-${abi}.apk"
          done
          # Only arm64-v8a is built (-PkomihoAbi) so neither of these should exist;
          # the rm's are belt-and-braces in case the ABI flag ever regresses.
          rm -f komiho-ci-universal.apk komiho-ci-armeabi-v7a.apk
          ls -la

      - name: "Upload APK to CI Release (tag: CI, title: Komiho-CI)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="CI"
          TITLE="Komiho-CI"
          RUN_NO="${{ github.run_number }}"
          BUILD_DATE=$(date -u +%Y%m%d)
          NOTES="Auto build #${RUN_NO} · ${{ github.sha }} · ${BUILD_DATE}T$(date -u +%H:%M:%SZ)"
          cd app/build/outputs/apk/release

          # Komiho (2026-09-18): retry the asset upload. Bundling libQnnHtpPrepare.so
          # pushed the arm64 APK from ~80 MB to ~110 MB, and the release-asset upload
          # endpoint is single-connection with no resumable chunks — at that size it
          # started returning a bare
          #
          #     HTTP 500: Error saving asset (.../komiho-ci-arm64-v8a.apk)
          #
          # after ~5.5 minutes of transfer (run 35256372680). The build itself was
          # green: the APK existed at 115784119 bytes and the QNN asset check passed.
          # 500 from uploads.github.com is transient far more often than not, so retry
          # with a growing backoff before declaring the job failed. Do NOT drop this
          # in favour of "upload faster" — without it a single backend hiccup turns a
          # perfectly good build red, which is exactly what happened.
          upload_with_retry() {
            local file="$1" attempt delay
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" \
                   --repo "${{ github.repository }}" \
                   --clobber; then
                echo "uploaded $file (attempt $attempt)"
                return 0
              fi
              delay=$((attempt * 20))
              echo "::warning::upload of $file failed (attempt $attempt/5), retrying in ${delay}s"
              sleep "$delay"
            done
            echo "::error::upload of $file failed after 5 attempts"
            return 1
          }

          # Upload smallest-first so the APKs people actually flash land before any
          # long transfer can time out.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release exists: overwrite APKs in place, keep fixed title.
            for apk in $(ls -S -r komiho-ci-*.apk); do
              upload_with_retry "$apk"
            done
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            # First time: create the release with no assets, then push each one
            # through the retrying helper. Passing the files straight to
            # `gh release create` would give us exactly one shot per asset, which is
            # the path that failed on run 35256372680.
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
            for apk in $(ls -S -r komiho-ci-*.apk); do
              upload_with_retry "$apk"
            done
          fi
