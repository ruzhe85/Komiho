name: Build Komiho V2 APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # MihonSY: cache Gradle dependencies — cuts rebuild time roughly in half.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Komiho M1: compile-verify only (no signing/release yet — M5 adds the
      # release pipeline with keystore secrets). Debug APK is enough to validate
      # compilation of the Komga data layer + UI.
      - name: Build debug APK
        run: ./gradlew assembleDebug -Pdisable-code-shrink --no-daemon --stacktrace

      # Upload to a fixed-tag Release instead of Actions artifacts — the
      # artifact storage quota is exhausted, Release assets have no such limit.
      - name: Upload APKs to Release (ci-apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ci-apk app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" \
            --title "Komiho V2 CI APK" \
            --notes "Auto build $(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>/dev/null \
            || gh release upload ci-apk app/build/outputs/apk/debug/*.apk --repo "${{ github.repository }}" --clobber
