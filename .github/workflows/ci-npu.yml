name: CI-NPU (full package)

# Komiho (2026-09-18): on-demand build for the *complete* artifact set, including the
# universal APK. Only run this when you actually need it — it is roughly 20 minutes of
# upload time because the universal package is ~228 MB once the fifteen QNN contexts
# (3 models × 5 HTP generations) and the five HTP Skel/stub pairs are merged into one file.
#
# Why this exists as a separate workflow rather than a second step in build.yml:
#   * build.yml (every push to main) stays fast and green — it publishes the per-ABI
#     APKs only, which is what gets flashed in day-to-day testing.
#   * the universal APK is what `gh release upload` timed out on (18 minutes, then
#     `HTTP 400`), which used to turn an otherwise successful build red.
#
# The code, the QNN assets and the Skel libraries are the SAME in both workflows — this
# is purely about which artifacts get published, not about compiling anything differently.
# There is no NPU-specific branch to keep in sync.

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish a proper (non-prerelease) GitHub Release under. Leave empty to just refresh the CI channel.'
        required: false
        default: ''
      release_name:
        description: 'Release title (only used when release_tag is set).'
        required: false
        default: ''

jobs:
  build-full:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-debug.jks
          ls -la keystore/

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-release.jks
          ls -la keystore/

      # NOTE: deliberately NO `-PkomihoAbi` here. That property (see
      # app/build.gradle.kts splits) narrows the build to one ABI and turns off the
      # universal APK — build.yml passes it to keep the daily channel small/fast.
      # This workflow exists precisely to produce every ABI *plus* the merged
      # universal APK, so it must omit the flag and take the default branch.
      - name: Build release APK (all ABIs + universal)
        env:
          KOMIHO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KOMIHO_RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Pdisable-code-shrink --no-daemon --stacktrace

      # Sanity check: the QNN native libraries are the whole reason this workflow is
      # separate, so fail loudly here rather than shipping an APK whose DSP cannot load
      # its Skel (that failure is silent at runtime — the reader just falls back).
      - name: "Verify QNN assets are bundled"
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*-release.apk; do
            echo "--- $apk"
            unzip -l "$apk" | grep -E 'libQnn|qnn-contexts' | head -30
            # Every library here is dlopen()ed by NAME at runtime and is therefore
            # invisible to a DT_NEEDED scan of any of our .so files:
            #
            #   * (libQnnModelDlc.so — DROPPED 2026-09-18: DLC container reader /
            #     QnnModel_composeGraphs entry point; qnn_backend.cpp treats its
            #     absence as non-fatal LOGW, and contextCreateFromBinary never reaches DLC.
            #     Saved ~3.3 MB. Re-add if a device fails NPU init on it.)
            #   * libQnnHtpV{69,73,75,79,81}Skel.so — the DSP-side HTP kernels. The
            #     HTP backend picks one at runtime through ADSP_LIBRARY_PATH; we do not
            #     choose the arch from Kotlin, so *every* arch must be present.
            #     2026-09-19: these now come from qnn-runtime **2.50.0** (upgraded from
            #     2.49.0) so that the locally-compiled fp16 context — which carries QAIRT
            #     2.49.40 — satisfies QNN's "runtime >= context compile version" rule.
            #     The earlier "match the reference build (app.mihon 1.3.9)" baseline no
            #     longer applies; sizes differ from the upstream APK by design.
            #   * libQnnHtpV{69,73,75,79,81}Stub.so — the matching host-side stubs.
            #
            # History, because this comment has been wrong twice (2026-09-18):
            # libQnnModelDlc.so was added as "the fix" for the on-device
            # `loadRemoteSymbols failed with err 4000` / `Failed to load skel, error: 4000`
            # chain, and the error chain came back byte-for-byte identical. The failure is
            # in the DSP transport / skel-load stage; 4000 is QNN_MIN_ERROR_BACKEND
            # (QnnCommon.h:77) and 14001 is QNN_DEVICE_ERROR_INVALID_CONFIG
            # (QnnMinimum.Device + 1), i.e. backend / device level, not "file not found".
            #
            # Do NOT "optimise" this list by dropping entries: their absence is silent,
            # costs nothing at build time, and only shows up as a missing NPU on a real
            # phone. (Exception: the Prepare .so WAS dropped 2026-09-18 — it is only
            # loaded via libQnnHtp.so's internal PrepareLibLoader, which our
            # contextCreateFromBinary path never reaches; dropping it saved ~79 MB with no
            # change to the NPU success path.)
            for need in libQnnHtp.so libQnnSystem.so \
                        libQnnHtpV69Skel.so libQnnHtpV69Stub.so \
                        libQnnHtpV73Skel.so libQnnHtpV73Stub.so \
                        libQnnHtpV75Skel.so libQnnHtpV75Stub.so \
                        libQnnHtpV79Skel.so libQnnHtpV79Stub.so \
                        libQnnHtpV81Skel.so libQnnHtpV81Stub.so; do
              if ! unzip -l "$apk" | grep -q "$need"; then
                echo "::error::$apk is missing $need"
                exit 1
              fi
            done
            if [ "$(unzip -l "$apk" | grep -c 'qnn-contexts/.*\.bin')" -ne 15 ]; then
              echo "::error::$apk does not carry the 6 QNN contexts"
              exit 1
            fi
          done

      - name: "Rename APKs to komiho-ci-*"
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*.apk; do
            [ -e "$apk" ] || continue
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            mv "$apk" "komiho-ci-${abi}.apk"
          done
          ls -la

      # Same upload path as build.yml, minus the universal exclusion. Retry a few times:
      # the universal transfer is the one that trips up `gh`, and a retry keeps a
      # 20-minute job from dying at the last step.
      - name: "Upload ALL APKs to CI Release (tag: CI, title: Komiho-CI)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="CI"
          TITLE="Komiho-CI"
          RUN_NO="${{ github.run_number }}"
          BUILD_DATE=$(date -u +%Y%m%d)
          NOTES="Full build #${RUN_NO} · ${{ github.sha }} · ${BUILD_DATE}T$(date -u +%H:%M:%SZ)"
          cd app/build/outputs/apk/release
          upload_with_retry() {
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$1" --repo "${{ github.repository }}" --clobber; then
                return 0
              fi
              echo "::warning::upload of $1 failed (attempt $attempt/3), retrying in 30s"
              sleep 30
            done
            echo "::error::upload of $1 failed after 3 attempts"
            return 1
          }
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            for apk in komiho-ci-*.apk; do upload_with_retry "$apk"; done
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" $(ls -S -r komiho-ci-*.apk) \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

      # Optional: publish a proper Release (not the CI prerelease) when a tag was given.
      - name: "Publish Release (only when release_tag was supplied)"
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          NAME="${{ inputs.release_name }}"
          [ -n "$NAME" ] || NAME="$TAG"
          cd app/build/outputs/apk/release
          # Reuse the already-renamed files but present them under release-style names.
          for apk in komiho-ci-*.apk; do
            cp "$apk" "${apk/komiho-ci-/komiho-}"
          done
          gh release create "$TAG" komiho-*.apk \
            --repo "${{ github.repository }}" \
            --title "$NAME" \
            --generate-notes \
            --target "${{ github.sha }}"
