name: Issue moderator

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - name: Moderate issues
        uses: tachiyomiorg/issue-moderator-action@v2.6.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Komiho: duplicate detection only — the label below already exists in the repo.
          # The upstream fork's auto-close rules were dropped (2026-09-16) because they describe a
          # different app: one of them auto-closed any issue that merely mentioned anime, two
          # others pointed at features Komiho does not have (online sources, Cloudflare-protected
          # sites, MyAnimeList), and the last two matched a plain-text bug template that no longer
          # exists — these issue forms are YAML and GitHub already enforces their required fields.
          duplicate-label: duplicate
