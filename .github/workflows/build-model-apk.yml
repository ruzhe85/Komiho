name: Build model package APK

# Komiho (2026-09-19 模型插件化): packages ONE SoC's worth of NPU contexts into an
# asset-only plugin APK (`:modelapk` module). The host app scans these packages at
# runtime — building a new model package NEVER requires a host release.
#
# Data layout (branch `model-sources`, organised **by SoC** — that is how the compile
# pipeline emits them):
#   v<arch>/<stem>.v<arch>.bin    one directory per HTP generation (v69/v73/v75/v79/v81)
#   models.json                   global model registry (protocol v1: id/stem/scale/
#                                 padding/label — padding is derived from the ONNX by
#                                 the packaging pipeline, never hand-edited)
# The workflow walks the chosen SoC directory, looks every stem up in the registry and
# generates the package manifest with `arches = [<soc>]` — so installing a package for
# the wrong generation is harmless: the host filters those models out instead of
# offering chips that could only fall back.
#
# Usage: run with soc=v79 (etc). Signed with the SAME release keystore as the host (the
# scanner rejects mismatched signatures); uploaded to the `CI` pre-release.
#
# Install `komiho-model-v<soc>.apk`, then open 增强设置 — every model of that generation
# appears in the NPU group immediately (the list refreshes on every resume of the screen).

"on":
  workflow_dispatch:
    inputs:
      soc:
        description: 'HTP generation to package: v69 / v73 / v75 / v79 / v81'
        required: true
        type: string
      model_version_name:
        description: 'Package versionName'
        required: false
        default: '1.0'
        type: string
      model_version_code:
        description: 'Package versionCode (bump it to ship a package update)'
        required: false
        default: '1'
        type: string

jobs:
  build-model-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout host (main)
        uses: actions/checkout@v7

      - name: Checkout model sources (branch model-sources)
        uses: actions/checkout@v7
        with:
          ref: model-sources
          path: model-sources

      - name: Validate SoC input
        env:
          SOC: ${{ inputs.soc }}
        run: |
          case "$SOC" in
            v69|v73|v75|v79|v81) ;;
            *) echo "::error::soc must be one of v69/v73/v75/v79/v81, got '$SOC'"; exit 1 ;;
          esac
          [ -d "model-sources/$SOC" ] || { echo "::error::missing model-sources/$SOC"; exit 1; }
          [ -f "model-sources/models.json" ] || { echo "::error::missing model-sources/models.json"; exit 1; }
          echo "SOC=${SOC}" >> "$GITHUB_ENV"
          echo "ARCH=${SOC#v}" >> "$GITHUB_ENV"

      - name: Stage assets into the modelapk module
        env:
          SOC: ${{ inputs.soc }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, sys
          soc = os.environ["SOC"]            # e.g. v79
          arch = os.environ["ARCH"]          # e.g. 79
          src = "model-sources"
          registry = json.load(open(f"{src}/models.json", encoding="utf-8"))
          if registry.get("protocolVersion", 1) > 1:
              sys.exit("::error::registry protocol newer than the packager")
          by_stem = {m["stem"]: m for m in registry.get("models", [])}
          bins = sorted(f for f in os.listdir(f"{src}/{soc}") if f.endswith(".bin"))
          if not bins:
              sys.exit(f"::error::no context bins under {src}/{soc}")
          os.makedirs("modelapk/src/main/assets/qnn-contexts", exist_ok=True)
          models = []
          for fname in bins:
              suffix = f".{soc}.bin"
              if not fname.endswith(suffix):
                  sys.exit(f"::error::{fname} does not match the <stem>.{soc}.bin naming")
              stem = fname[: -len(suffix)]
              m = by_stem.get(stem)
              if m is None:
                  sys.exit(f"::error::{stem} has no entry in models.json registry")
              if not m.get("id") or not m.get("label") or m.get("padding", 0) <= 0:
                  sys.exit(f"::error::incomplete registry entry for {stem}: {m}")
              shutil.copy2(f"{src}/{soc}/{fname}",
                           f"modelapk/src/main/assets/qnn-contexts/{fname}")
              models.append({"id": m["id"], "stem": stem, "scale": m.get("scale", 2),
                             "padding": m["padding"], "arches": [arch], "label": m["label"]})
          manifest = {"protocolVersion": 1, "models": models}
          with open("modelapk/src/main/assets/models.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"BIN_COUNT={len(models)}\n")
          print(f"staged {len(models)} models for {soc}: "
                + ", ".join(m["id"] for m in models))
          PY
          find modelapk/src/main/assets -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        # NDK is not exercised by this no-code module, but the shared convention sets an
        # ndkVersion and every other project module gets configured too — install it to
        # keep configuration deterministic.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Decode release keystore
        # MUST be the same keystore as the host app: NpuModelPluginScanner rejects model
        # packages whose signing certificate does not match the host's.
        run: |
          mkdir -p keystore
          echo "${{ secrets.KOMIHO_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/komiho-release.jks
          ls -la keystore/

      - name: Build model package APK
        env:
          KOMIHO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KOMIHO_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :modelapk:assembleRelease \
            -PmodelId="cn.ruzhe.komiho.model.${SOC}" \
            -PmodelLabel="Komiho-${SOC}" \
            -PmodelVersionName="${{ inputs.model_version_name }}" \
            -PmodelVersionCode="${{ inputs.model_version_code }}" \
            --no-daemon --stacktrace

      - name: "Strip dex and re-sign (asset-only guarantee)"
        # AGP 9 dexes ~2.2MB (convention/catalog-injected code) into this source-less
        # module no matter what the DSL says. The package is hasCode=false, so the dex is
        # dead weight: delete it, re-align, re-sign with the host keystore.
        env:
          KOMIHO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KOMIHO_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          APK=modelapk/build/outputs/apk/release/modelapk-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          if unzip -l "$APK" | grep -q 'classes.dex'; then
            echo "stripping dex:"
            unzip -l "$APK" | grep 'classes.dex'
            zip -d "$APK" 'classes*.dex'
            "$BT/zipalign" -f 4 "$APK" "$APK.aligned"
            mv "$APK.aligned" "$APK"
            "$BT/apksigner" sign \
              --ks keystore/komiho-release.jks --ks-type PKCS12 \
              --ks-key-alias komiho-release \
              --ks-pass "pass:${KOMIHO_RELEASE_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KOMIHO_RELEASE_KEYSTORE_PASSWORD}" \
              --out "$APK.signed" "$APK"
            mv "$APK.signed" "$APK"
            "$BT/apksigner" verify "$APK" && echo "re-signed OK"
          fi

      - name: Verify package contents
        run: |
          APK=modelapk/build/outputs/apk/release/modelapk-release.apk
          [ -f "$APK" ] || { echo "::error::APK missing"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/models.json' \
            || { echo "::error::models.json not bundled"; exit 1; }
          GOT=$(unzip -l "$APK" | grep -c 'assets/qnn-contexts/.*\.bin' || true)
          echo "contexts bundled: $GOT / expected ${BIN_COUNT}"
          [ "$GOT" -eq "${BIN_COUNT}" ] || { echo "::error::context count mismatch"; exit 1; }
          # AGP 9 still emits a stub classes.dex for hasCode=false application modules.
          # A *stub* is tiny (<200KB); real injected code (e.g. the desugar runtime the
          # shared convention used to pull in) is MBs — fail loudly on that.
          DEX_LINE=$(unzip -l "$APK" | grep 'classes.dex' || true)
          if [ -n "$DEX_LINE" ]; then
            echo "classes.dex present: $DEX_LINE"
            DEX_SIZE=$(echo "$DEX_LINE" | awk '{print $1}')
            if [ "$DEX_SIZE" -gt 200000 ]; then
              echo "::error::model package contains real code (${DEX_SIZE} bytes in classes.dex)"
              exit 1
            fi
          fi

      - name: Rename to komiho-model-<soc>.apk
        run: |
          cp modelapk/build/outputs/apk/release/modelapk-release.apk "komiho-model-${SOC}.apk"
          ls -la komiho-model-*.apk

      - name: "Upload to qnn-model Release (tag: qnn-model)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="qnn-model"
          upload_with_retry() {
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$1" --repo "${{ github.repository }}" --clobber; then
                return 0
              fi
              echo "::warning::upload of $1 failed (attempt $attempt/3), retrying in 30s"
              sleep 30
            done
            echo "::error::upload of $1 failed after 3 attempts"
            return 1
          }
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "Komiho NPU Models" --notes "QNN/HTP NPU model packages (one APK per SoC generation). Host CI APKs live in the \`CI\` tag, not here." --prerelease
          fi
          upload_with_retry "komiho-model-${SOC}.apk"
