name: 🐞 Bug report
description: Report a bug in Komiho
labels: [bug]
body:

  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Komiho. **Only the three fields marked *required* need filling in** — the rest are optional, but the more you can tell us the faster this gets fixed.
        Please check that you are on the [latest release](https://github.com/ruzhe85/Komiho/releases/latest) before reporting.
        Note that Komiho ships no content of its own — it is a reader for Komga, local files, WebDAV and SMB, so problems with the Komga server, the network share, or where the files come from cannot be handled here.

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide an example of the issue.
      placeholder: |
        Example:
          1. First step
          2. Second step
          3. Issue here
    validations:
      required: true

  - type: input
    id: komiho-version
    attributes:
      label: Komiho version
      description: You can find your Komiho version in **Settings → About**, shown as `Version x.y.z (build)`.
      placeholder: |
        Example: "1.1.0 (8)"
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what actually happens. A screenshot or short recording helps a lot.
      placeholder: |
        Example:
          "This happened instead..."

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
      placeholder: |
        Example:
          "This should happen..."

  - type: textarea
    id: crash-logs
    attributes:
      label: Crash logs
      description: |
        If the app crashes it opens a crash screen — tap **Share crash logs** (中文界面：**导出崩溃日志**) there and attach the exported file here.
        You can also paste the relevant log lines as plain text.
      placeholder: |
        Attach the exported crash log file, or paste the log text here.

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: |
        Example: "Android 14"

  - type: input
    id: device
    attributes:
      label: Device
      description: Phone / tablet model, or the TV box type if relevant.
      placeholder: |
        Example: "OnePlus 12"

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.
